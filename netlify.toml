[build.processing]
  skip_processing = true

# One public host, one path and one status-200 URL for each document.
[[redirects]]
  from = "https://www.bludle.com/*"
  to = "https://bludle.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/colourMatch/*"
  to = "/colormatch/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/game/nerdle.html"
  to = "/werdle/"
  status = 301
  force = true

[[redirects]]
  from = "/alex/*"
  to = "/colormatch/"
  status = 301
  force = true

[[redirects]]
  from = "/benefits/*"
  to = "/brain-training-games/"
  status = 301
  force = true

# Netlify's directory handling supplies trailing-slash redirects for game and guide folders.

[[headers]]
  for = "/*"
  [headers.values]
    Link = "</sitemap.xml>; rel=\"sitemap\""
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/globalNav/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
