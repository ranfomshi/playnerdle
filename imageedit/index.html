<head>
    <style>:root{--color1:purple;--color2:orange;--color3:red;--color4:blue}body{margin:0;overflow:auto;background-color:var(--color2)}</style>

<body>

    <canvas id="myCanvas" style="margin: 10px;"></canvas>

    <div id="dotImage" style="margin: 10px;"></div>
    <input type="text" id="newImageUrl" placeholder="image URL" onchange="update(event)">
    <script>

        var dotList = []
        var previousPixelTotal = 0
        var Canvas = function (canvasEl, width, height) {
            this.el = canvasEl;
            this.el.width = width;
            this.el.height = height;
            this.ctx = canvasEl.getContext("2d");
        }


        var canvas = new Canvas(document.getElementById("myCanvas"), 1600, 800)

        //1. create img
        var img = new Image();
        img.crossOrigin = "";

        //2. register a callback on onload event img
        img.onload = function () {
            //4 draw img on canvas ctx
            canvas.ctx.drawImage(this, 0, 0, canvas.el.width, canvas.el.height)

            //5 get pixel data from the ctx
            var pixels = canvas.ctx.getImageData(0, 0, canvas.el.width, canvas.el.height)

            //6 manipulate pixel data

            for (var i = 0, len = pixels.data.length; i < len; i += 4) {


                //red
                var red = pixels.data[i];
                //green
                var green = pixels.data[i + 1];
                //blue
                var blue = pixels.data[i + 2];
                //opacity
                var opac = pixels.data[i + 3];


                currentPixelTotal = red + green + blue + opac


                pixels.data[i] = red
                pixels.data[i + 1] = green
                pixels.data[i + 2] = blue

                // if(previousPixelTotal>currentPixelTotal){
                //     pixels.data[i] = pixels.data[i-4]  
                // pixels.data[i + 1] = pixels.data[i-3]  
                // pixels.data[i + 2] = pixels.data[i-2]  
                // }

                var abovePixel = pixels.data[i-1600]+pixels.data[i-1599]+pixels.data[i+1598]
            
                    pixels.data[i] = pixels.data[i+6400]
                pixels.data[i + 1] = pixels.data[i+6401]
                pixels.data[i + 2] = pixels.data[i+6402]
   
                
                
                //pixelate - the for loop above needs to iterate every 64

                dotList.push([red, green, blue, opac])
                var c = document.getElementById('dotImage')
                c.style.display = 'flex'
                c.style.flexWrap = 'wrap'
                c.style.width = (800 / 16) * 32 + 'px'
                var newDot = document.createElement('div')
                newDot.style.background = 'rgba(' + red + ',' + green + ',' + blue + ',' + 1 + ')'
                newDot.style.width = '16px'
                newDot.style.height = '1px'
                c.appendChild(newDot)

                previousPixelTotal = currentPixelTotal

            }


            //7 set new pixel data
            canvas.ctx.putImageData(pixels, 0, 0)






        }

        img.src = 'https://images.unsplash.com/photo-1542202229-7d93c33f5d07?ixlib=rb-1.2.1&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1470&q=80'


        //update pixelated image

        function update(e) {
            var c = document.getElementById('dotImage')
            c.innerHTML = ''
            img.src = e.target.value
        }






    </script>


<script data-explainer-injected="v1">
(function () {
  const storageKey = "explainerSeen_imageedit_v1";
  const modal = document.createElement("div");
  modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px;";
  modal.innerHTML = `<div style="max-width:520px;width:100%;background:#fff;color:#111;padding:20px;border-radius:12px;font-family:Arial,sans-serif;box-shadow:0 16px 40px rgba(0,0,0,.35);">
      <h2 style="margin:0 0 8px 0;font-size:1.3rem;">How to play Image Dot Editor</h2>
      <p style="line-height:1.45;margin:0 0 16px 0;">Paste an image URL and the app samples pixel changes into dot values. Try different images to compare patterns.</p>
      <button id="explainerCloseBtn" style="padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer;">Got it</button>
    </div>`;

  const helpBtn = document.createElement("button");
  helpBtn.type = "button";
  helpBtn.setAttribute("aria-label", "Open game explainer");
  helpBtn.textContent = "?";
  helpBtn.style.cssText = "position:fixed;top:12px;right:12px;width:36px;height:36px;border-radius:999px;border:none;background:#111;color:#fff;font-weight:700;cursor:pointer;z-index:9998;";

  function openExplainer() {
    modal.style.display = "flex";
  }

  function closeExplainer(markSeen) {
    modal.style.display = "none";
    if (markSeen) localStorage.setItem(storageKey, "true");
  }

  document.body.appendChild(helpBtn);
  document.body.appendChild(modal);
  helpBtn.addEventListener("click", openExplainer);
  modal.addEventListener("click", function (event) {
    if (event.target === modal) closeExplainer(true);
  });
  modal.querySelector("#explainerCloseBtn").addEventListener("click", function () {
    closeExplainer(true);
  });

  if (localStorage.getItem(storageKey) !== "true") {
    openExplainer();
  }
})();
</script>
