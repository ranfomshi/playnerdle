    <div id="game-container">
        <div id="instructions">Click to start the game. React quickly when the screen turns white.</div>
        <div id="game-screen" onclick="handleClick()"></div>
        <div id="time-bank">Time left: <span id="time-left">5</span>s</div>
        <div id="bonus-bank">Bonus Time: <span id="bonus-time">0</span>s</div>
        <div id="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <script>
        let timeLeft = 5;
        let bonusTime = 0;
        let gameStarted = false;
        let reactionTime = 0;
        let gameScreen = document.getElementById("game-screen");
        let timeLeftDisplay = document.getElementById("time-left");
        let bonusTimeDisplay = document.getElementById("bonus-time");
        let progressBar = document.getElementById("progress-bar");
        let timeout;

        function startGame() {
            gameStarted = true;
            document.getElementById("instructions").style.display = "none";
            triggerColorChange();
        }

        function isTimeUp() {
            return timeLeft + bonusTime <= 0;
        }

        function triggerColorChange() {
            if (isTimeUp()) {
                gameOver("Time's up!");
                return;
            }

            let randomTime = Math.random() * 1500 + 500; // Random time between 0.5 and 2 seconds
            timeout = setTimeout(changeToWhite, randomTime);
        }

        function changeToWhite() {
            reactionTime = Date.now();
            gameScreen.style.backgroundColor = "white";
        }

        function handleClick() {
            if (!gameStarted) {
                startGame();
                return;
            }

            if (isTimeUp()) {
                gameOver("Time's up!");
                return;
            }

            if (gameScreen.style.backgroundColor != "white") {
                gameOver("Clicked too early!");
                return;
            }

            let currentTime = Date.now();
            let reaction = (currentTime - reactionTime) / 1000;
            updateTimes(reaction);
            gameScreen.style.backgroundColor = "grey";
            if (timeLeft > 0) {
                triggerColorChange();
            } else if (bonusTime > 0) {
                useBonusTime();
            } else {
                gameOver("Time's up!");
            }
        }

        function updateTimes(reaction) {
            timeLeft -= reaction;
            timeLeft = Math.max(timeLeft, 0);
            timeLeftDisplay.textContent = timeLeft.toFixed(2);

            if (reaction <= 0.5) {
                let additionalTime = 0.05;
                if (reaction <= 0.4) additionalTime = 0.1;
                if (reaction <= 0.3) additionalTime = 0.2;
                if (reaction <= 0.2) additionalTime = 0.3;

                bonusTime += additionalTime;
                bonusTimeDisplay.textContent = bonusTime.toFixed(2);
            }

            updateProgressBar();
        }

        function useBonusTime() {
            timeLeft = bonusTime;
            bonusTime = 0;
            bonusTimeDisplay.textContent = bonusTime.toFixed(2);
            timeLeftDisplay.textContent = timeLeft.toFixed(2);
            triggerColorChange();
            updateProgressBar();
        }

        function updateProgressBar() {
            let totalAvailableTime = timeLeft + bonusTime;
            let progressBarWidth = (totalAvailableTime / 5) * 100; // Assuming initial time is 5s
            progressBar.style.width = progressBarWidth + '%';
        }

        function gameOver(message) {
            alert(message);
            clearTimeout(timeout);
            // Reset game
            timeLeft = 5;
            bonusTime = 0;
            gameStarted = false;
            document.getElementById("instructions").style.display = "block";
            gameScreen.style.backgroundColor = "grey";
            timeLeftDisplay.textContent = timeLeft.toFixed(2);
            bonusTimeDisplay.textContent = bonusTime.toFixed(2);
            progressBar.style.width = '100%';
        }
    </script>

<script data-explainer-injected="v1">
(function () {
  const storageKey = "explainerSeen_push_v1";
  const modal = document.createElement("div");
  modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px;";
  modal.innerHTML = `<div style="max-width:520px;width:100%;background:#fff;color:#111;padding:20px;border-radius:12px;font-family:Arial,sans-serif;box-shadow:0 16px 40px rgba(0,0,0,.35);">
      <h2 style="margin:0 0 8px 0;font-size:1.3rem;">How to play Push</h2>
      <p style="line-height:1.45;margin:0 0 16px 0;">Wait for the screen to turn white, then click as quickly as possible. Build bonus time with fast reactions.</p>
      <button id="explainerCloseBtn" style="padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer;">Got it</button>
    </div>`;

  const helpBtn = document.createElement("button");
  helpBtn.type = "button";
  helpBtn.setAttribute("aria-label", "Open game explainer");
  helpBtn.textContent = "?";
  helpBtn.style.cssText = "position:fixed;top:12px;right:12px;width:36px;height:36px;border-radius:999px;border:none;background:#111;color:#fff;font-weight:700;cursor:pointer;z-index:9998;";

  function openExplainer() {
    modal.style.display = "flex";
  }

  function closeExplainer(markSeen) {
    modal.style.display = "none";
    if (markSeen) localStorage.setItem(storageKey, "true");
  }

  document.body.appendChild(helpBtn);
  document.body.appendChild(modal);
  helpBtn.addEventListener("click", openExplainer);
  modal.addEventListener("click", function (event) {
    if (event.target === modal) closeExplainer(true);
  });
  modal.querySelector("#explainerCloseBtn").addEventListener("click", function () {
    closeExplainer(true);
  });

  if (localStorage.getItem(storageKey) !== "true") {
    openExplainer();
  }
})();
</script>
