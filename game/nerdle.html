on{font-size:xx-small;width:100%}.letter{padding:2px}.content{padding:15px 4px 0}}@media only screen and (max-height:600px){h1{margin:0}}@media only screen and (min-width:800px){.key{width:10%;font-size:xx-large;padding:4px}.letter{padding:8px;width:25px}.definition{font-size:large;width:600px}}.blue{background-color:#64a7f3}.green{background-color:#b8edb5;color:#000}.welcomeModal{padding:40px 10px;position:fixed;box-shadow:0 0 10px #00000033;width:300px;max-width:89%;height:600px;left:50%;transform:translateX(-50%) translateY(10px);background:#556677f0;z-index:1}.helpBtn{position:fixed;top:0;left:0;padding:10px;font-size:x-large}@keyframes appear{0%{transform:rotate3d(1,0,0,90deg)}100%{transform:rotate3d(1,0,0,0deg)}}.fa{display:inline-block;font:14px/1 FontAwesome;font-size:inherit;text-rendering:auto;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}.fa-question-circle:before{content:"\f059"}</style>

<body>
    <div onclick="closeWelcome()" class="helpBtn"><i class="fa fa-question-circle" aria-hidden="true"></i></div>
    <div id="welcome" class="welcomeModal">You get 5 attempts to guess a 5-letter word correctly.<br><br>
        If you guess a letter in the correct position, it will show as green. <div class="letter green">n</div><br><br>
        If you guess a letter but in an incorrect position, it will show as blue. <div class="letter blue">n</div>
        <br><br>
        <kbd class="key" style="font-size:small; width: auto;" onclick="closeWelcome()">OK - Let's Begin</kbd>
    </div>

    <div id="content" class="content">
        <h1>WERDLE</h1>

        <input type="text" onkeypress="enterSubmit(event)" onsubmit="gameAttempt()" id="userInput" placeholder="guess"
            style="margin-top: 10px; margin-bottom: 10px; height: 16px;"></input>
        <br>
        <div id="statusAlert" class="statusAlert" aria-live="polite"></div>

        <div id="gameText" class="gameText"></div>
        <div id="bottomPortion" style="position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: small; margin-top:20px; 
            display:none; 
            text-align: center; 
            white-space: nowrap;">
            <div id="definition" class="definition"></div>
            <div id="possibleArea"></div>
        </div>
        <div id="incorrectArea" style="position: fixed;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: small; margin-top:20px; 
            display:block; 
            text-align: center; 
            white-space: nowrap;">Incorrect letters will show
            here</div>
