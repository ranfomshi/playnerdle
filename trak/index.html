<body>
  <div id="instruction">When the ball disappears, keep track of it and click when it's in the green zone</div>
  <div id="navbar-container"></div>
  <h4 id="title">Trak</h4>
  <div id="info">
    <div id="level">Level: 1</div>
    <div id="lives">Lives: 3</div>
  </div>
  <div id="clickArea">
    <div id="gameZone">
      <div id="targetZone"></div>
      <div id="ball"></div>
    </div>
  </div>

  <div id="message"></div>
  <button id="restartButton" onclick="restartGame()">Restart Game</button>

  <script>
    let ball = document.getElementById("ball");
    let gameZone = document.getElementById("gameZone");
    let messageDiv = document.getElementById("message");
    let levelDiv = document.getElementById("level");
    let direction = 1; // 1 means down, -1 means up
    let speed = 2;
    let level = 1;
    let interval;
    let transparentInterval;

    let lives = 3;
    let livesDiv = document.getElementById("lives");

    let totalDistanceTraveled = 0;

    function computeTransparencyDistance() {
      // Calculate the number of brackets of 5 levels
      let brackets = Math.floor((level - 1) / 5);
      return (
        410 + Math.random() * 10 + 400 * brackets - ball.offsetHeight / 2
      );
    }

    const moveBall = () => {
      let ballPosition = ball.offsetTop;
      if (ballPosition <= 0) {
        direction = 1; // Move down
      } else if (ballPosition >= gameZone.offsetHeight - ball.offsetHeight) {
        direction = -1; // Move up
      }

      // Calculate the new position
      let newPosition = ballPosition + direction * speed;
      ball.style.top = newPosition + "px";

      // Update the total distance traveled
      totalDistanceTraveled += Math.abs(newPosition - ballPosition);

      // Check if the ball should be made transparent
      if (
        totalDistanceTraveled >= computeTransparencyDistance() &&
        ball.style.opacity != "0"
      ) {
        ball.style.opacity = "0";
        enableClicks();
      }
    };

    const enableClicks = () => {
      document.getElementById('clickArea').style.pointerEvents = "auto";
    };

    const checkWin = () => {
      ball.style.opacity = 0.5;
      let ballCenterPosition = ball.offsetTop + ball.offsetHeight / 2;
      let targetPosition = gameZone.offsetHeight / 2 - 50;

      if (
        ballCenterPosition >= targetPosition &&
        ballCenterPosition <= targetPosition + 100
      ) {
        messageDiv.innerHTML = `
  <div style="width: 50px; height: 50px; background-color: green; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
    <span style="color: white; font-size: 24px;">✓</span>
  </div>`;

        level++;
        speed += 0.5;
      } else {
        messageDiv.innerHTML = `
  <div style="width: 50px; height: 50px; background-color: red; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
    <span style="color: white; font-size: 24px;">X</span>
  </div>`;
        lives--;
        livesDiv.textContent = "Lives: " + lives;

        if (lives <= 0) {
          messageDiv.textContent = "Game Over!";
          clearInterval(interval);
          document.body.removeEventListener("click", checkWin);
          document.getElementById("restartButton").style.display = "block";
          return;
        }
      }
      levelDiv.textContent = "Level: " + level;
      clearInterval(interval);
      setTimeout(startGame, 2000);
    };

    const restartGame = () => {
      lives = 3;
      level = 1;
      speed = 2;
      livesDiv.textContent = "Lives: " + lives;
      levelDiv.textContent = "Level: " + level;
      document.getElementById("restartButton").style.display = "none";
      ball.style.opacity = "1";
      startGame();
    };

    const startGame = () => {
      totalDistanceTraveled = 0; // Reset the distance traveled when the game restarts
      clearInterval(interval);

      ball.style.top = "0px";
      ball.style.opacity = "1";
      document.getElementById('clickArea').style.pointerEvents = "none";
      messageDiv.textContent = "";
      interval = setInterval(moveBall, 50);

      document.body.addEventListener("click", checkWin);
    };

    startGame();
  </script>

<script data-explainer-injected="v1">
(function () {
  const storageKey = "explainerSeen_trak_v1";
  const modal = document.createElement("div");
  modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px;";
  modal.innerHTML = `<div style="max-width:520px;width:100%;background:#fff;color:#111;padding:20px;border-radius:12px;font-family:Arial,sans-serif;box-shadow:0 16px 40px rgba(0,0,0,.35);">
      <h2 style="margin:0 0 8px 0;font-size:1.3rem;">How to play Trak</h2>
      <p style="line-height:1.45;margin:0 0 16px 0;">Track the hidden moving ball and click when you think it is inside the green target zone.</p>
      <button id="explainerCloseBtn" style="padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer;">Got it</button>
    </div>`;

  const helpBtn = document.createElement("button");
  helpBtn.type = "button";
  helpBtn.setAttribute("aria-label", "Open game explainer");
  helpBtn.textContent = "?";
  helpBtn.style.cssText = "position:fixed;top:12px;right:12px;width:36px;height:36px;border-radius:999px;border:none;background:#111;color:#fff;font-weight:700;cursor:pointer;z-index:9998;";

  function openExplainer() {
    modal.style.display = "flex";
  }

  function closeExplainer(markSeen) {
    modal.style.display = "none";
    if (markSeen) localStorage.setItem(storageKey, "true");
  }

  document.body.appendChild(helpBtn);
  document.body.appendChild(modal);
  helpBtn.addEventListener("click", openExplainer);
  modal.addEventListener("click", function (event) {
    if (event.target === modal) closeExplainer(true);
  });
  modal.querySelector("#explainerCloseBtn").addEventListener("click", function () {
    closeExplainer(true);
  });

  if (localStorage.getItem(storageKey) !== "true") {
    openExplainer();
  }
})();
</script>
