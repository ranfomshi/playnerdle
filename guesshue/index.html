  <style>
    body {
      background-color: #f4f4f4;
      font-family: "Roboto", sans-serif;
      text-align: center;
    }

    .container {
      margin: auto;
      max-width: 315px;
      /* 100px * 3 squares + 5px * 2 gaps */
      font-size: 0;
      margin-top: 100px;
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-gap: 5px;
    }

    .grid-square {
      width: 100px;
      height: 100px;
      display: inline-block;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .grid-square:active {
      transform: scale(0.97);
    }

    .grid-square.correct-click {
      animation: pop-correct 0.18s ease-out;
    }

    .grid-square.wrong-click {
      animation: shake-wrong 0.2s ease-in-out;
    }

    @keyframes pop-correct {
      0% {
        transform: scale(0.96);
      }

      60% {
        transform: scale(1.05);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes shake-wrong {
      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }
    }


    .spark {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: spark-burst 420ms ease-out forwards;
      z-index: 1000;
    }

    @keyframes spark-burst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--spark-x)), calc(-50% + var(--spark-y))) scale(0.35);
      }
    }

    #timer {
      width: 100%;
      height: 20px;
      margin-top: 100px;
      background: rgb(0, 0, 0);
    }

    #gameOverScreen {
      display: none;
      position: absolute;
      padding-top: 20px;
      top: 40px;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      text-align: center;
      font-size: 32px;
    }

    /* CSS */
    .button-85 {
      padding: 0.6em 2em;
      margin-top: 40px;
      border: none;
      outline: none;
      color: rgb(255, 255, 255);
      background: #111;
      cursor: pointer;
      position: relative;
      z-index: 0;
      border-radius: 10px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .button-85:before {
      content: "";
      background: linear-gradient(45deg,
          #ff0000,
          #ff7300,
          #fffb00,
          #48ff00,
          #00ffd5,
          #002bff,
          #7a00ff,
          #ff00c8,
          #ff0000);
      position: absolute;
      top: -2px;
      left: -2px;
      background-size: 400%;
      z-index: -1;
      filter: blur(5px);
      -webkit-filter: blur(5px);
      width: calc(100% + 4px);
      height: calc(100% + 4px);
      animation: glowing-button-85 20s linear infinite;
      transition: opacity 0.3s ease-in-out;
      border-radius: 10px;
    }

    @keyframes glowing-button-85 {
      0% {
        background-position: 0 0;
      }

      50% {
        background-position: 400% 0;
      }

      100% {
        background-position: 0 0;
      }
    }

    .button-85:after {
      z-index: -1;
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: #222;
      left: 0;
      top: 0;
      border-radius: 10px;
    }

    .statContainer {
      display: flex;
      flex-direction: row;
      justify-content: center;
      max-width: 700px;
      margin: auto;
    }

    .stat {
      background-color: white;
      color: black;
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      display: inline-block;
      width: 20%;
      flex-grow: 1;
    }

    .stat>h6 {
      margin-top: 5px;
      margin-bottom: 5px;
    }

    @media only screen and (max-width: 500px) {
      .stat {
        font-size: 1.2rem;
      }

      p {
        font-size: 1.2rem;
      }
    }

    #welcome {
      font-size: 2rem;
      width: 300px;
      margin: auto;
      margin-top: 10px;
    }

    #highScoreStat {
      background-color: black;
      color: white;
    }
  </style>

<body>

  <div id="streakCounter">Streak: <span id="streak">0</span></div>
  <div id="timer"></div>
  <div class="container"></div>
  <div id="gameOverScreen">
    Game Over!<br />
    <div class="statContainer">
      <div class="stat">
        <h6>Final Streak:</h6>
        <span id="finalStreak">0</span>
      </div>
      <div class="stat">
        <h6>Average Time:</h6>
        <span id="averageTime">0</span>s
      </div>
      <div class="stat">
        <h6>Slowest Time:</h6>
        <span id="slowestTime">0</span>s
      </div>
      <div class="stat" id="highScoreStat">
        <h6>High Score:</h6>
        <span id="highScore">0</span>
      </div>
    </div>
    <div class='statContainer'>
      <div id="newRecord" class="stat" style="display: none;">New Record!</div>
    </div>
    <br />
    <button id="restartButton" class="button-85">Restart</button>
    <div id="welcome">
      <h6>If you're new here:</h6>
      <p><small>You have 4 seconds per coloured grid to choose the odd one out and keep your streak going. It's as
          simple as that!</small></p>
    </div>
  </div>
  <link rel="stylesheet" href="/globalNav/globalNav.css">
  <script type="module" src="/globalNav/globalNav.js" defer></script>
  <script>
    let streak = 0;
    let oddPosition;
    let timer;
    let startTime;
    let roundTimes = [];
    let slowestTime = 0;

    // Load high score from local storage
    const loadHighScore = () => {
      const highScore = localStorage.getItem('highScore') || 0;
      document.getElementById('highScore').textContent = highScore;
      return highScore;
    };

    let highScore = loadHighScore();

    const updateStreakDisplay = () => {
      document.getElementById("streak").textContent = streak;
    };

    const generateColor = () => {
      const r = Math.floor(Math.random() * 256);
      const g = Math.floor(Math.random() * 256);
      const b = Math.floor(Math.random() * 256);
      return `rgb(${r}, ${g}, ${b})`;
    };

    const generateSlightlyDifferentColor = (color) => {
      const [r, g, b] = color.match(/\d+/g).map(Number);
      const newR = Math.min(255, r + 10);
      const newG = Math.min(255, g + 10);
      const newB = Math.min(255, b + 10);
      return `rgb(${newR}, ${newG}, ${newB})`;
    };

    const startTimer = () => {
      const timerElement = document.getElementById("timer");
      let width = 100;
      timerElement.style.width = `${width}%`;

      clearInterval(timer);
      timer = setInterval(() => {
        width -= 1;
        timerElement.style.width = `${width}%`;
        if (width <= 0) {
          clearInterval(timer);
          showGameOver();
        }
      }, 40);
    };

    const calculateAverageTime = () => {
      if (roundTimes.length === 0) return 0;
      const total = roundTimes.reduce((acc, val) => acc + val, 0);
      return (total / roundTimes.length).toFixed(2);
    };

    const initGameBoard = () => {
      const container = document.querySelector(".container");
      container.innerHTML = "";
      const mainColor = generateColor();
      const oddColor = generateSlightlyDifferentColor(mainColor);
      oddPosition = Math.floor(Math.random() * 9);

      for (let i = 0; i < 9; i++) {
        const square = document.createElement("div");
        square.className = "grid-square";
        square.style.backgroundColor = i === oddPosition ? oddColor : mainColor;
        square.addEventListener("click", (event) => checkSquare(i, square, event));
        container.appendChild(square);
      }
      startTime = Date.now();
      startTimer();
    };

    const showGameOver = () => {
      clearInterval(timer);
      document.getElementById("finalStreak").textContent = streak;
      document.getElementById("averageTime").textContent = calculateAverageTime();
      document.getElementById("slowestTime").textContent = slowestTime.toFixed(2);
      document.getElementById("gameOverScreen").style.display = "block";

      if (streak > highScore) {
        highScore = streak;
        localStorage.setItem('highScore', highScore);
        document.getElementById('highScore').textContent = highScore;
        document.getElementById('newRecord').style.display = 'block';
      }
    };

    const restartGame = () => {
      streak = 0;
      oddPosition = null;
      timer = null;
      startTime = null;
      roundTimes = [];
      slowestTime = 0;
      updateStreakDisplay();
      initGameBoard();
      document.getElementById("gameOverScreen").style.display = "none";
      document.getElementById('newRecord').style.display = 'none';
    };

    document.getElementById("restartButton").addEventListener("click", restartGame);


    const createCartoonySparks = (event, color) => {
      const sparkCount = 6;

      for (let i = 0; i < sparkCount; i++) {
        const spark = document.createElement("span");
        spark.className = "spark";
        spark.style.backgroundColor = color;

        const angle = (Math.PI * 2 * i) / sparkCount + (Math.random() * 0.35);
        const distance = 12 + Math.random() * 18;
        spark.style.setProperty("--spark-x", `${Math.cos(angle) * distance}px`);
        spark.style.setProperty("--spark-y", `${Math.sin(angle) * distance}px`);
        spark.style.left = `${event.clientX}px`;
        spark.style.top = `${event.clientY}px`;

        document.body.appendChild(spark);
        spark.addEventListener("animationend", () => spark.remove(), { once: true });
      }
    };

    const checkSquare = (index, squareElement, event) => {
      const endTime = Date.now();
      const timeTaken = (endTime - startTime) / 1000;
      clearInterval(timer);

      if (index === oddPosition) {
        squareElement.classList.add("correct-click");
        createCartoonySparks(event, "#fff275");
        roundTimes.push(timeTaken);
        slowestTime = Math.max(slowestTime, timeTaken);
        streak++;
        updateStreakDisplay();
        setTimeout(initGameBoard, 120);
      } else {
        squareElement.classList.add("wrong-click");
        createCartoonySparks(event, "#ff7a7a");
        setTimeout(showGameOver, 140);
      }
    };

    initGameBoard();
  </script>

      <button id="explainerCloseBtn" style="padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer;">Got it</button>
    </div>`;

  const helpBtn = document.createElement("button");
  helpBtn.type = "button";
  helpBtn.setAttribute("aria-label", "Open game explainer");
  helpBtn.textContent = "?";
  helpBtn.style.cssText = "position:fixed;top:12px;right:12px;width:36px;height:36px;border-radius:999px;border:none;background:#111;color:#fff;font-weight:700;cursor:pointer;z-index:9998;";

  function openExplainer() {
    modal.style.display = "flex";
  }

  function closeExplainer(markSeen) {
    modal.style.display = "none";
    if (markSeen) localStorage.setItem(storageKey, "true");
  }

  document.body.appendChild(helpBtn);
  document.body.appendChild(modal);
  helpBtn.addEventListener("click", openExplainer);
  modal.addEventListener("click", function (event) {
    if (event.target === modal) closeExplainer(true);
  });
  modal.querySelector("#explainerCloseBtn").addEventListener("click", function () {
    closeExplainer(true);
  });

  if (localStorage.getItem(storageKey) !== "true") {
    openExplainer();
  }
})();
</script>
