name: Search quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canonical pages, metadata, links and structured data
        run: node scripts/audit-search.mjs
      - name: Validate site-wide analytics coverage
        run: node scripts/audit-analytics.mjs
