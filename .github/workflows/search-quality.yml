name: Search quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canonical pages, metadata, links and structured data
        run: node scripts/audit-search.mjs
      - name: Validate site-wide analytics coverage
        run: node scripts/audit-analytics.mjs
      - name: Validate controlled monetization coverage
        run: node scripts/audit-monetization.mjs
      - name: Validate game engagement and funnel coverage
        run: node scripts/audit-engagement.mjs
      - name: Validate privacy-safe game performance telemetry
        run: node scripts/audit-game-telemetry.mjs
      - name: Validate Werdle opening-guess telemetry
        run: node scripts/audit-werdle-first-guess.mjs
      - name: Validate Word Mash answer normalisation
        run: node scripts/audit-wordmash.mjs
      - name: Validate Shifty Fades gameplay presentation
        run: node scripts/audit-shiftyfades.mjs
      - name: Validate purposeful motion enhancements
        run: node scripts/audit-motion.mjs
